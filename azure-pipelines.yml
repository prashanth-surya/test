# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

parameters:
- name: myParameter
  type: string
  default: 'defaultValue'

pool:
  name: ubuntu-latest

steps:
- checkout: none
- script: |
    waiting for completion
    echo ${{ parameters.myParameter }}
    sleep 30
  displayName: 'wait 600 seconds'
